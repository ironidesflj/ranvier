<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranvier — prévia do traço animado</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; background:#f7fbf9; color:#0e1b1c; }
  body { min-height:100vh; display:grid; place-items:center; margin:0; }
  main { text-align:center; padding:32px; }
  .mark { width:150px; height:150px; color:#0e1b1c; }
  .stroke { fill:none; stroke:currentColor; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:420; stroke-dashoffset:420; animation:draw 700ms cubic-bezier(.22,.8,.25,1) forwards; }
  .node { fill:#246cad; opacity:0; animation:appear 120ms ease 560ms forwards; }
  h1 { font: 32px Georgia, serif; margin:16px 0 8px; }
  p { color:#526163; margin:0; }
  button { margin-top:24px; border:1px solid #b9c7c5; border-radius:10px; padding:10px 16px; background:white; cursor:pointer; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes appear { to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .stroke { animation:none; stroke-dashoffset:0; } .node { animation:none; opacity:1; } }
</style>
<main>
  <svg class="mark" viewBox="0 0 120 120" aria-label="Monograma Ranvier">
    <path class="stroke" d="M38 94V26 M38 26h22a20 20 0 0 1 0 40H38 M60 66l6.4 6.4 M82 88l6 6"/>
    <circle class="node" cx="73.8" cy="79.8" r="2.8"/>
  </svg>
  <h1>Ranvier</h1>
  <p>Prévia do traço animado · 700 ms</p>
  <button onclick="location.reload()">Repetir animação</button>
</main>
</html>
