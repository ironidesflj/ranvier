<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ranvier</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      color-scheme: light dark;
      --bg: #f7fbf9;
      --fg: #0e1b1c;
      --muted: #525d5e;
      --rule: #c8d2d0;
      --ranvier-node: #246cad;
      --app-soft: rgba(36, 108, 173, 0.14);
      --noos: #32a188;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0f10;
        --fg: #e4e9e8;
        --muted: #929a99;
        --rule: #2c3535;
        --ranvier-node: #8ab8e8;
        --app-soft: rgba(138, 184, 232, 0.16);
        --noos: #69c1ae;
      }
    }

    [data-theme="light"] {
      --bg: #f7fbf9;
      --fg: #0e1b1c;
      --muted: #525d5e;
      --rule: #c8d2d0;
      --ranvier-node: #246cad;
      --app-soft: rgba(36, 108, 173, 0.14);
      --noos: #32a188;
    }

    [data-theme="dark"] {
      --bg: #0a0f10;
      --fg: #e4e9e8;
      --muted: #929a99;
      --rule: #2c3535;
      --ranvier-node: #8ab8e8;
      --app-soft: rgba(138, 184, 232, 0.16);
      --noos: #69c1ae;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      cursor: pointer;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mark {
      width: 116px;
      height: 120px;
      color: var(--fg);
      overflow: visible;
      display: block;
    }

    .footer-lockup {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .rule {
      width: 32px;
      height: 1px;
      background: var(--rule);
      transform-origin: center;
      opacity: 0;
      animation: ran-rule-expand 620ms cubic-bezier(0.22, 1, 0.36, 1) 1880ms forwards;
    }

    .by-noos {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transform: translateX(-1px) translateY(5px);
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      line-height: 1;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-decoration: none;
      opacity: 0;
      animation: ran-noos-fade 640ms cubic-bezier(0.22, 1, 0.36, 1) 1940ms forwards;
      transition: color 180ms ease-out;
    }

    .by-noos:hover {
      color: var(--fg);
    }

    @keyframes ran-orbit-draw {
      0% { stroke-dashoffset: 100; opacity: 0; }
      30% { opacity: 0.45; }
      100% { stroke-dashoffset: 0; opacity: 0.45; }
    }
    @keyframes ran-micro-node-in {
      0% { opacity: 0; transform: scale(0.3); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes ran-spine-draw {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ran-wavefront {
      0% { stroke-dasharray: 0 100; stroke-dashoffset: 100; opacity: 0; }
      15% { stroke-dasharray: 18 100; opacity: 1; }
      85% { stroke-dasharray: 10 100; stroke-dashoffset: 8; opacity: 1; }
      100% { stroke-dasharray: 0 100; stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes ran-ion-ripple {
      0% { opacity: 0; transform: scale(0.25); stroke-width: 1.8px; }
      30% { opacity: 0.82; }
      100% { opacity: 0; transform: scale(2.4); stroke-width: 0.25px; }
    }
    @keyframes ran-quantum-k1 {
      0% { opacity: 0; transform: scale(0.2); }
      50% { opacity: 0.95; transform: scale(1.45); }
      100% { opacity: 0.42; transform: scale(1); }
    }
    @keyframes ran-quantum-k2 {
      0% { opacity: 0; transform: scale(0.2); }
      50% { opacity: 1; transform: scale(1.45); }
      100% { opacity: 0.72; transform: scale(1); }
    }
    @keyframes ran-node-ignite {
      0% { opacity: 0; transform: scale(0.2); }
      45% { opacity: 1; transform: scale(1.45); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes ran-larmor-shot {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ran-rule-expand {
      0% { transform: scaleX(0); opacity: 0; }
      100% { transform: scaleX(1); opacity: 1; }
    }
    @keyframes ran-noos-fade {
      0% { opacity: 0; transform: translateX(-1px) translateY(5px); }
      100% { opacity: 1; transform: translateX(-1px) translateY(0); }
    }

    .ran-anim-e1 { stroke-dasharray: 100; stroke-dashoffset: 100; animation: ran-orbit-draw 700ms cubic-bezier(0.22, 1, 0.36, 1) 120ms forwards; }
    .ran-anim-e2 { stroke-dasharray: 100; stroke-dashoffset: 100; animation: ran-orbit-draw 760ms cubic-bezier(0.22, 1, 0.36, 1) 190ms forwards; }
    .ran-anim-e3 { stroke-dasharray: 100; stroke-dashoffset: 100; animation: ran-orbit-draw 800ms cubic-bezier(0.22, 1, 0.36, 1) 250ms forwards; }
    .ran-anim-guide { stroke-dasharray: 100; stroke-dashoffset: 100; animation: ran-orbit-draw 620ms cubic-bezier(0.22, 1, 0.36, 1) 620ms forwards; }
    .ran-anim-myelin { stroke-dasharray: 100; stroke-dashoffset: 100; animation: ran-spine-draw 1000ms cubic-bezier(0.65, 0, 0.15, 1) 260ms forwards; }
    .ran-anim-wave { stroke-dasharray: 0 100; stroke-dashoffset: 100; opacity: 0; animation: ran-wavefront 1000ms cubic-bezier(0.65, 0, 0.15, 1) 260ms forwards; }
    .ran-anim-n2 { opacity: 0; transform-origin: 34px 100px; animation: ran-micro-node-in 300ms ease-out 260ms forwards; }
    .ran-anim-n1 { opacity: 0; transform-origin: 34px 20px; animation: ran-micro-node-in 300ms ease-out 520ms forwards; }
    .ran-anim-n3 { opacity: 0; transform-origin: 87.55px 42px; animation: ran-micro-node-in 300ms ease-out 820ms forwards; }
    .ran-anim-n4 { opacity: 0; transform-origin: 54px 62px; animation: ran-node-ignite 380ms cubic-bezier(0.22, 1, 0.36, 1) 1040ms forwards; }
    .ran-anim-mesh-nodes { opacity: 0; animation: ran-micro-node-in 500ms ease-out 480ms forwards; }
    .ran-anim-ripple-1 { opacity: 0; transform-origin: 59.5px 65.5px; animation: ran-ion-ripple 620ms cubic-bezier(0.16, 1, 0.3, 1) 1100ms forwards; }
    .ran-anim-ripple-2 { opacity: 0; transform-origin: 59.5px 65.5px; animation: ran-ion-ripple 680ms cubic-bezier(0.16, 1, 0.3, 1) 1200ms forwards; }
    .ran-anim-k1 { opacity: 0; transform-origin: 57.64px 64.07px; animation: ran-quantum-k1 360ms cubic-bezier(0.16, 1, 0.3, 1) 1160ms forwards; }
    .ran-anim-k2 { opacity: 0; transform-origin: 60.46px 65.83px; animation: ran-quantum-k2 360ms cubic-bezier(0.16, 1, 0.3, 1) 1250ms forwards; }
    .ran-anim-a1 { opacity: 0; transform-origin: 65px 69px; animation: ran-node-ignite 400ms cubic-bezier(0.16, 1, 0.3, 1) 1340ms forwards; }
    .ran-anim-larmor { stroke-dasharray: 100; stroke-dashoffset: 100; animation: ran-larmor-shot 540ms cubic-bezier(0.08, 0.82, 0.17, 1) 1380ms forwards; }
    .ran-anim-a2 { opacity: 0; transform-origin: 90px 98px; animation: ran-node-ignite 320ms cubic-bezier(0.22, 1, 0.36, 1) 1760ms forwards; }

    @media (prefers-reduced-motion: reduce) {
      .ran-anim-e1, .ran-anim-e2, .ran-anim-e3, .ran-anim-guide { animation: none !important; stroke-dashoffset: 0 !important; opacity: 0.45 !important; }
      .ran-anim-myelin, .ran-anim-larmor { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; }
      .ran-anim-wave, .ran-anim-ripple-1, .ran-anim-ripple-2 { animation: none !important; opacity: 0 !important; }
      .ran-anim-n1, .ran-anim-n2, .ran-anim-n3, .ran-anim-n4, .ran-anim-mesh-nodes, .ran-anim-a1, .ran-anim-a2, .rule, .by-noos {
        animation: none !important; opacity: 1 !important; transform: none !important;
      }
      .ran-anim-k1 { animation: none !important; opacity: 0.42 !important; }
      .ran-anim-k2 { animation: none !important; opacity: 0.72 !important; }
    }
  </style>
</head>
<body onclick="replay()">
  <main class="stage" id="stage" aria-label="Ranvier by Noos">
    <svg class="mark" viewBox="0 0 116 120" fill="none" aria-hidden="true">
      <g stroke="currentColor" stroke-width="1.1">
        <ellipse cx="34" cy="60" rx="9" ry="40" pathLength="100" class="ran-anim-e1"/>
        <ellipse cx="58" cy="42" rx="33" ry="16" transform="rotate(-16 58 42)" pathLength="100" class="ran-anim-e2"/>
        <ellipse cx="58" cy="42" rx="33" ry="16" transform="rotate(16 58 42)" pathLength="100" class="ran-anim-e3"/>
        <path d="M34 54.22A88.25 88.25 0 0 1 54 62" stroke-dasharray="2.2 2.8" stroke-linecap="round" pathLength="100" class="ran-anim-guide"/>
      </g>
      <path d="M34 100V20A53.55 22 0 0 1 87.55 42A53.55 21.56 0 0 1 54 62" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="100" class="ran-anim-myelin"/>
      <path d="M34 100V20A53.55 22 0 0 1 87.55 42A53.55 21.56 0 0 1 54 62" stroke="var(--ranvier-node)" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" pathLength="100" class="ran-anim-wave"/>
      <circle cx="59.5" cy="65.5" r="4.8" stroke="var(--ranvier-node)" fill="none" class="ran-anim-ripple-1"/>
      <circle cx="59.5" cy="65.5" r="3" stroke="var(--ranvier-node)" fill="none" class="ran-anim-ripple-2"/>
      <path d="M65 69A88.25 88.25 0 0 1 90 98" stroke="var(--ranvier-node)" stroke-width="2.5" stroke-linecap="round" pathLength="100" class="ran-anim-larmor"/>
      <g fill="currentColor" class="ran-anim-mesh-nodes">
        <circle cx="34" cy="54.22" r="1.5"/><circle cx="25" cy="60" r="1.5"/><circle cx="40.43" cy="32" r="1.6"/>
        <circle cx="43" cy="59.79" r="1.6"/><circle cx="28.45" cy="42" r="1.4"/><circle cx="58" cy="25.51" r="1.5"/>
      </g>
      <g fill="currentColor">
        <circle cx="34" cy="100" r="2.2" class="ran-anim-n2"/>
        <circle cx="34" cy="20" r="2.2" class="ran-anim-n1"/>
        <circle cx="87.55" cy="42" r="2.2" class="ran-anim-n3"/>
        <circle cx="54" cy="62" r="2.3" class="ran-anim-n4"/>
      </g>
      <g fill="var(--ranvier-node)">
        <circle cx="57.64" cy="64.07" r="1.05" class="ran-anim-k1"/>
        <circle cx="60.46" cy="65.83" r="1.4" class="ran-anim-k2"/>
        <g class="ran-anim-a1">
          <circle cx="65" cy="69" r="6.2" fill="var(--app-soft)"/>
          <circle cx="65" cy="69" r="3.3"/>
        </g>
        <circle cx="90" cy="98" r="2.2" class="ran-anim-a2"/>
      </g>
    </svg>

    <div class="footer-lockup">
      <div class="rule" aria-hidden="true"></div>
      <a class="by-noos" href="https://noos.study" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
        <svg width="13" height="13" viewBox="0 0 120 120" fill="none" aria-hidden="true">
          <circle cx="60" cy="60" r="42" stroke="currentColor" stroke-width="16"/>
          <circle cx="60" cy="18" r="9" fill="currentColor"/>
          <circle cx="18" cy="60" r="9" fill="currentColor"/>
          <circle cx="60" cy="102" r="9" fill="currentColor"/>
          <circle cx="102" cy="60" r="11" fill="var(--noos)"/>
        </svg>
        <span><span style="opacity:.72">by</span> <strong style="font-weight:500">Noos</strong></span>
      </a>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');

    window.addEventListener('keydown', (e) => {
      if (e.key === 't' || e.key === 'T') {
        const cur = document.documentElement.dataset.theme;
        const isDark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
      }
    });

    function replay() {
      const stage = document.getElementById('stage');
      const clone = stage.cloneNode(true);
      stage.parentNode.replaceChild(clone, stage);
    }
  </script>
</body>
</html>
