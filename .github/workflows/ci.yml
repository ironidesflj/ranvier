name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Validate question bank
        run: bun run validate:questions

      - name: Question-bank quality gate
        run: bun run ci:gate

      - name: Validate manifest.jsonl (hub contract, zero tolerance)
        run: bun scripts/validate-manifest.ts

      - name: Quality-gate red team selftest
        run: bun run ci:gate:selftest

      - name: Build
        run: bun run build
