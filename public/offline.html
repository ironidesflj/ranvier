<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7fbf9" />
  <title>Ranvier — offline</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7fbf9; --surface: #ffffff; --fg: #0e1b1c; --muted: #525d5e;
      --border: #d9e0de; --app-ink: #1b5285; --node: #246cad;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0f10; --surface: #121919; --fg: #e4e9e8; --muted: #929a99;
        --border: #2c3535; --app-ink: #8ab8e8; --node: #8ab8e8;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 380px; }
    .mark { margin: 0 auto 20px; color: var(--fg); }
    .mark svg { width: 56px; height: 56px; }
    h1 {
      font-family: "Newsreader", Georgia, serif;
      font-weight: 400;
      font-size: 24px;
      letter-spacing: -0.02em;
    }
    .endorse {
      margin-top: 6px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 13px;
      color: var(--muted);
    }
    p {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .meta {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <!-- Símbolo Ranvier — Topologia Orbital 'R' (56px) -->
      <svg viewBox="0 0 120 120" fill="none">
        <g stroke="currentColor" stroke-width="1.4" opacity=".48">
          <ellipse cx="34" cy="60" rx="9" ry="40"/>
          <ellipse cx="58" cy="42" rx="33" ry="16" transform="rotate(-16 58 42)"/>
          <ellipse cx="58" cy="42" rx="33" ry="16" transform="rotate(16 58 42)"/>
          <path d="M34 54.22A88.25 88.25 0 0 1 54 62" stroke-dasharray="2.2 2.8" stroke-linecap="round"/>
        </g>
        <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <path d="M34 20V100"/>
          <path d="M34 20A53.55 22 0 0 1 87.55 42A53.55 21.56 0 0 1 54 62"/>
        </g>
        <path d="M65 69A88.25 88.25 0 0 1 90 98" stroke="var(--node)" stroke-width="3" stroke-linecap="round"/>
        <g fill="currentColor">
          <circle cx="34" cy="20" r="2.6"/>
          <circle cx="34" cy="100" r="2.6"/>
          <circle cx="87.55" cy="42" r="2.6"/>
          <circle cx="54" cy="62" r="2.6"/>
        </g>
        <g fill="var(--node)">
          <circle cx="59.21" cy="65.03" r="1.5" opacity=".7"/>
          <circle cx="65" cy="69" r="3.8"/>
          <circle cx="90" cy="98" r="2.6"/>
        </g>
      </svg>
    </div>
    <h1>Ranvier</h1>
    <p class="endorse">by Noos</p>
    <p>Você está offline. O rascunho, o histórico e as explicações já baixadas continuam disponíveis. A sincronização espera a conexão.</p>
    <p class="meta">Local-First · v1.10.0</p>
  </div>
</body>
</html>
