<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0B1424" />
  <title>Ranvier — offline</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B1424;
      color: #e7edf5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 380px; }
    .mark {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      border-radius: 14px;
      background: #246cad;
      display: flex; align-items: center; justify-content: center;
    }
    .mark svg { width: 38px; height: 38px; }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    p { margin-top: 8px; font-size: 14px; line-height: 1.6; color: #9fb0c3; }
    p.en { font-size: 12.5px; color: #7c8ca0; }
    button {
      margin-top: 22px;
      padding: 10px 22px;
      border: 0;
      border-radius: 10px;
      background: #246cad;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2e7fc0; }
    button:focus-visible { outline: 2px solid #9cc4e8; outline-offset: 2px; }
    .badge { margin-top: 26px; font-size: 10px; color: #6d7d92; }
    .badge i { font-family: Georgia, "Times New Roman", serif; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 33.5 28 43.5 46 22" />
      </svg>
    </div>
    <h1>Você está offline</h1>
    <p>O Ranvier precisa de conexão na primeira visita. Reconecte-se e tente de novo — depois disso, o app abre mesmo sem internet.</p>
    <p class="en">You are offline. Reconnect and try again — after your first visit, the app opens even without internet.</p>
    <button onclick="location.replace('/')">Tentar de novo / Try again</button>
    <div class="badge">by <i>Noos</i></div>
  </main>
</body>
</html>
